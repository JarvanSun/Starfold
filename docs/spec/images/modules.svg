<svg xmlns="http://www.w3.org/2000/svg" width="680" height="494" viewBox="0 0 680 494" role="img">
  <title>Starfold module architecture</title>
  <desc>Three platform apps depend on the StarfoldShared package, which contains App, Features, Services and UserInterface. StarfoldShared depends on XboxKit and StreamKit; StreamKit depends on XboxKit and LiveKitWebRTC.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; }
    .title { font-size: 14px; font-weight: 500; }
    .sub { font-size: 12px; }
    .arrow { stroke: #888780; stroke-width: 1.5; fill: none; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .title { fill: #3C3489; } .purple .sub { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .title { fill: #085041; } .teal .sub { fill: #0F6E56; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .title { fill: #2C2C2A; } .gray .sub { fill: #5F5E5A; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .title { fill: #712B13; } .coral .sub { fill: #993C1D; }
    .plain rect { fill: #FFFFFF; stroke: #888780; } .plain .title { fill: #444441; font-weight: 400; }
    @media (prefers-color-scheme: dark) {
      .arrow { stroke: #B4B2A9; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .title { fill: #EEEDFE; } .purple .sub { fill: #CECBF6; }
      .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .title { fill: #E1F5EE; } .teal .sub { fill: #9FE1CB; }
      .gray rect { fill: #444441; stroke: #B4B2A9; } .gray .title { fill: #F1EFE8; } .gray .sub { fill: #D3D1C7; }
      .coral rect { fill: #712B13; stroke: #F0997B; } .coral .title { fill: #FAECE7; } .coral .sub { fill: #F5C4B3; }
      .plain rect { fill: #2C2C2A; stroke: #B4B2A9; } .plain .title { fill: #D3D1C7; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="purple">
    <rect x="50" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="140" y="58" text-anchor="middle">StarfoldMac</text>
    <text class="sub" x="140" y="78" text-anchor="middle">Views, Navigation</text>
  </g>
  <g class="purple">
    <rect x="250" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="340" y="58" text-anchor="middle">StarfoldVision</text>
    <text class="sub" x="340" y="78" text-anchor="middle">Views, Navigation</text>
  </g>
  <g class="purple">
    <rect x="450" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="540" y="58" text-anchor="middle">StarfoldTV</text>
    <text class="sub" x="540" y="78" text-anchor="middle">+ Top Shelf extension</text>
  </g>

  <line class="arrow" x1="140" y1="96" x2="140" y2="138" marker-end="url(#arrow)"/>
  <line class="arrow" x1="340" y1="96" x2="340" y2="138" marker-end="url(#arrow)"/>
  <line class="arrow" x1="540" y1="96" x2="540" y2="138" marker-end="url(#arrow)"/>

  <g class="teal">
    <rect x="50" y="140" width="580" height="124" rx="20" stroke-width="0.5"/>
    <text class="title" x="70" y="164">StarfoldShared</text>
    <text class="sub" x="610" y="164" text-anchor="end">shared by all platforms</text>
  </g>
  <g class="gray">
    <rect x="70" y="186" width="125" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="132" y="204" text-anchor="middle">App</text>
    <text class="sub" x="132" y="224" text-anchor="middle">AppViewModel</text>
  </g>
  <g class="gray">
    <rect x="207" y="186" width="125" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="269" y="204" text-anchor="middle">Features</text>
    <text class="sub" x="269" y="224" text-anchor="middle">ViewModels</text>
  </g>
  <g class="gray">
    <rect x="344" y="186" width="125" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="406" y="204" text-anchor="middle">Services</text>
    <text class="sub" x="406" y="224" text-anchor="middle">protocols + Live</text>
  </g>
  <g class="gray">
    <rect x="481" y="186" width="125" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="543" y="204" text-anchor="middle">UserInterface</text>
    <text class="sub" x="543" y="224" text-anchor="middle">shared styles</text>
  </g>

  <line class="arrow" x1="185" y1="264" x2="185" y2="308" marker-end="url(#arrow)"/>
  <line class="arrow" x1="495" y1="264" x2="495" y2="308" marker-end="url(#arrow)"/>

  <g class="coral">
    <rect x="50" y="310" width="270" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="185" y="328" text-anchor="middle">XboxKit</text>
    <text class="sub" x="185" y="348" text-anchor="middle">Sign-in, library, session API</text>
  </g>
  <g class="coral">
    <rect x="360" y="310" width="270" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="495" y="328" text-anchor="middle">StreamKit</text>
    <text class="sub" x="495" y="348" text-anchor="middle">WebRTC, input, Metal render</text>
  </g>

  <line class="arrow" x1="360" y1="338" x2="322" y2="338" marker-end="url(#arrow)"/>
  <line class="arrow" x1="495" y1="366" x2="495" y2="408" marker-end="url(#arrow)"/>

  <g class="plain">
    <rect x="360" y="410" width="270" height="44" rx="8" stroke-width="0.5"/>
    <text class="title" x="495" y="432" text-anchor="middle">LiveKitWebRTC (third party)</text>
  </g>
</svg>
